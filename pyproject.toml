[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "callisto-jupiter"
version = "0.1.0"
description = "Callisto server-monitoring metrics exporter (CPU/RAM/DISK/GPU → ingest DSN)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "psutil>=5.9",
    "requests>=2.28",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# NVIDIA's official bindings. They ship the same top-level `pynvml` module as the
# old `pynvml` distribution, which is deprecated and prints a FutureWarning on
# every import; nvidia-ml-py is the replacement it points at.
gpu = ["nvidia-ml-py>=12.535"]
dev = ["pytest>=7"]

[project.scripts]
callisto-jupiter = "callisto_jupiter.__main__:main"

[tool.setuptools]
packages = ["callisto_jupiter"]
